# Top-level dkms.conf for manual installs (dkms add /path/to/dtbocfg).
# The packaged build uses debian/dtbocfg-dkms.dkms instead (dh_dkms fills in
# #MODULE_VERSION# from debian/changelog); keep the two in sync.
PACKAGE_NAME="dtbocfg"
PACKAGE_VERSION="0.1"
MAKE="make KERNEL_SRC=/lib/modules/${kernelver}/build"
CLEAN="make clean KERNEL_SRC=/lib/modules/${kernelver}/build"
BUILT_MODULE_NAME[0]="dtbocfg"
DEST_MODULE_LOCATION[0]="/kernel/drivers/of/"
AUTOINSTALL="yes"

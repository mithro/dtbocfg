name: Debian Package + apt repo

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, sid]
    container: debian:${{ matrix.suite }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            dpkg-dev debhelper dh-dkms python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set changelog version from git
        run: python3 packaging/deb-version.py --write-changelog

      - name: Build package
        run: dpkg-buildpackage -b -us -uc

      - name: Collect debs
        run: |
          mkdir -p built-debs
          cp ../*.deb built-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}
          path: built-debs/

  publish-apt:
    # Build on PRs to validate, but never publish from one: that would
    # overwrite the live repository with unreviewed packages.
    if: github.event_name != 'pull_request'
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie sid"
      # Architecture: all -- one deb serves every architecture.
      architectures: "all"
      origin: dtbocfg
      description: "Device tree overlay configuration filesystem (DKMS)"
      keyring-name: dtbocfg.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
